services:
  - type: web
    name: causerie
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: causerie-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
databases:
  - name: causerie-db
